# Giao diện EDUCODER 10 — màu lấy từ logo Python (xanh #2B5B84, vàng #FFD43B)
# Phông chữ được đóng gói trong static/fonts nên chạy được cả khi không có Internet.
[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2B5B84"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#EAF0F6"
textColor = "#17233A"
linkColor = "#2B5B84"
borderColor = "#DCE3EC"
codeBackgroundColor = "#EEF2F7"
codeTextColor = "#1E4468"
font = "Be Vietnam Pro, sans-serif"
headingFont = "Be Vietnam Pro, sans-serif"
codeFont = "JetBrains Mono, monospace"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
blueColor = "#2B5B84"
greenColor = "#1F8A5B"
redColor = "#C0392B"
yellowColor = "#E0A800"
blueBackgroundColor = "#E7EEF6"
greenBackgroundColor = "#E5F4EC"
redBackgroundColor = "#FBEAE8"
yellowBackgroundColor = "#FFF6D6"
blueTextColor = "#1E4468"
greenTextColor = "#14603F"
redTextColor = "#922B21"
yellowTextColor = "#7A5A00"
chartCategoricalColors = ["#2B5B84", "#E0A800", "#1F8A5B", "#C0392B", "#6B7A90"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F9"
borderColor = "#E3E8EF"

